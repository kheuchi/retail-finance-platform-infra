name: Deploy AWS Bootstrap

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type apply to deploy the reviewed main branch
        required: true
        type: string

concurrency:
  group: deploy-aws-bootstrap
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Plan and apply bootstrap
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aws-bootstrap
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@cabfdba3510de1431bac9dba27511d97497fc100 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-terraform-deploy
          aws-region: eu-central-1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false
      - name: Initialize remote backend
        working-directory: bootstrap
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          terraform init -input=false \
            -backend-config="bucket=retail-finance-platform-tfstate-${account_id}-eu-central-1" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="region=eu-central-1" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
      - name: Create reviewed plan
        working-directory: bootstrap
        env:
          TF_VAR_budget_alert_email: ${{ secrets.TF_VAR_budget_alert_email }}
        run: terraform plan -input=false -lock-timeout=5m -out=bootstrap.tfplan
      - name: Apply exact saved plan
        working-directory: bootstrap
        run: terraform apply -input=false bootstrap.tfplan
