name: Deploy Databricks Workspace

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type apply to deploy the reviewed main branch of the databricks stack
        required: true
        type: string

concurrency:
  group: deploy-aws-bootstrap  # shared with bootstrap: never apply both stacks at once
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Plan and apply databricks stack
    if: github.ref == 'refs/heads/main' && inputs.confirmation == 'apply'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: aws-bootstrap
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out main
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: github-terraform-deploy-databricks
          aws-region: eu-central-1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false
      - name: Initialize remote backend
        working-directory: databricks
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          terraform init -input=false \
            -backend-config="bucket=retail-finance-platform-tfstate-${account_id}-eu-central-1" \
            -backend-config="key=databricks/terraform.tfstate" \
            -backend-config="region=eu-central-1" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
      - name: Create reviewed plan
        working-directory: databricks
        env:
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          TF_VAR_databricks_account_id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          TF_VAR_databricks_client_id: ${{ vars.DATABRICKS_CLIENT_ID }}
          TF_VAR_workspace_admin_user: ${{ vars.DATABRICKS_WORKSPACE_ADMIN }}
          TF_VAR_budget_alert_email: ${{ secrets.TF_VAR_budget_alert_email }}
        run: terraform plan -input=false -lock-timeout=5m -out=databricks.tfplan
      - name: Apply exact saved plan
        working-directory: databricks
        env:
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
        run: terraform apply -input=false databricks.tfplan
