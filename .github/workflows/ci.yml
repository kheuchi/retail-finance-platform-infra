name: Infrastructure CI and Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive -diff
      - name: Initialize without remote backend
        working-directory: bootstrap
        run: terraform init -backend=false -input=false
      - name: Validate Terraform
        working-directory: bootstrap
        run: terraform validate
      - name: Initialize databricks stack without remote backend
        working-directory: databricks
        run: terraform init -backend=false -input=false
      - name: Validate databricks stack
        working-directory: databricks
        run: terraform validate
      - name: Validate shell syntax
        run: bash -n scripts/*.sh

  checkov:
    name: Checkov advisory scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install pinned Checkov
        run: python -m pip install --disable-pip-version-check --requirement requirements-ci.txt
      - name: Scan Terraform
        run: checkov --directory bootstrap --directory databricks --framework terraform --compact --quiet

  cloud-plan:
    name: AWS Terraform plan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: terraform
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          role-session-name: github-terraform-plan
          aws-region: eu-central-1
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false
      - name: Initialize remote backend
        working-directory: bootstrap
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          terraform init -input=false \
            -backend-config="bucket=retail-finance-platform-tfstate-${account_id}-eu-central-1" \
            -backend-config="key=bootstrap/terraform.tfstate" \
            -backend-config="region=eu-central-1" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"
      - name: Plan against AWS
        working-directory: bootstrap
        env:
          TF_VAR_budget_alert_email: ${{ secrets.TF_VAR_budget_alert_email }}
          TF_VAR_databricks_account_id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
        run: terraform plan -input=false -lock-timeout=5m -no-color
      - name: Initialize databricks stack backend
        working-directory: databricks
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          terraform init -input=false             -backend-config="bucket=retail-finance-platform-tfstate-${account_id}-eu-central-1"             -backend-config="key=databricks/terraform.tfstate"             -backend-config="region=eu-central-1"             -backend-config="use_lockfile=true"             -backend-config="encrypt=true"
      - name: Plan databricks stack
        working-directory: databricks
        env:
          DATABRICKS_CLIENT_ID: ${{ vars.DATABRICKS_CLIENT_ID }}
          DATABRICKS_CLIENT_SECRET: ${{ secrets.DATABRICKS_CLIENT_SECRET }}
          TF_VAR_databricks_account_id: ${{ vars.DATABRICKS_ACCOUNT_ID }}
          TF_VAR_databricks_client_id: ${{ vars.DATABRICKS_CLIENT_ID }}
          TF_VAR_workspace_admin_user: ${{ vars.DATABRICKS_WORKSPACE_ADMIN }}
          TF_VAR_budget_alert_email: ${{ secrets.TF_VAR_budget_alert_email }}
        run: terraform plan -input=false -lock-timeout=5m -no-color

  release:
    name: Semantic release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.terraform.result == 'success'
    needs: [terraform, checkov, cloud-plan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Install release dependencies
        run: npm ci --ignore-scripts
      - name: Create semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
