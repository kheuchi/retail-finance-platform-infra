name: Infrastructure CI and Release

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: infra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: 1.14.6
          terraform_wrapper: false
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive -diff
      - name: Initialize without remote backend
        working-directory: bootstrap
        run: terraform init -backend=false -input=false
      - name: Validate Terraform
        working-directory: bootstrap
        run: terraform validate
      - name: Validate shell syntax
        run: bash -n scripts/*.sh

  checkov:
    name: Checkov advisory scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install pinned Checkov
        run: python -m pip install --disable-pip-version-check checkov==3.3.17
      - name: Scan Terraform
        run: checkov --directory bootstrap --framework terraform --compact --quiet

  release:
    name: Semantic release
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.terraform.result == 'success'
    needs: [terraform, checkov]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Check out full history
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "24.15.0"
          cache: npm
      - name: Install release dependencies
        run: npm ci --ignore-scripts
      - name: Create semantic release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
